name: Build MLC-Engine for S25 (v11)
on: [workflow_dispatch]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b 
          add-to-path: true

      - name: Setup Rust for Android
        run: |
          rustup target add aarch64-linux-android

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install cmake
          sudo apt-get update && sudo apt-get install -y build-essential git

      - name: Configure and Build
        run: |
          mkdir build && cd build
          # FLAGS REFORZADOS: Aseguramos que se intente construir el CLI
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DUSE_VULKAN=ON \
            -DUSE_OPENCL=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_LIBBACKTRACE=OFF \
            -DTVM_FFI_USE_LIBBACKTRACE=OFF \
            -DTVM_BACKTRACE_ON_SEGFAULT=OFF \
            -DMLC_LLM_BUILD_EXECUTABLE=ON \
            -DMLC_LLM_BUILD_CLI=ON
          
          # Intentamos construir todo. 'make' decidirá el nombre correcto del binario.
          make -j$(nproc)
          
      - name: Find and Prepare Binary
        if: always()
        run: |
          # Buscamos en todo el directorio de trabajo cualquier archivo ejecutable
          # que empiece por 'mlc' y que sea para arquitectura ARM/Android.
          echo "Iniciando búsqueda profunda de binarios..."
          
          # Esta línea busca el binario y lo copia a la raíz de build
          find . -type f -executable -name "mlc*" ! -path "*/CMakeFiles/*" -exec cp {} build/mlc_engine \; || true
          
          if [ -f "build/mlc_engine" ]; then
            echo "¡ÉXITO! Binario encontrado y normalizado a build/mlc_engine"
            ls -lh build/mlc_engine
          else
            echo "ERROR: No se encontró el ejecutable. Mostrando todos los ejecutables encontrados:"
            find . -type f -executable
            exit 1
          fi

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: mlc-cli-android-s25
          path: |
            build/mlc_engine
            build/*.so
            build/tvm/*.so
            build/lib/*.so
