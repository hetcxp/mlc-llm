name: Build MLC-Engine for S25 (v5)
on: [workflow_dispatch]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b 
          add-to-path: true

      # --- LA PIEZA QUE FALTABA ---
      - name: Setup Rust for Android
        run: |
          rustup target add aarch64-linux-android
      # ----------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install cmake
          sudo apt-get update && sudo apt-get install -y build-essential git

      - name: Configure and Build
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DUSE_VULKAN=ON \
            -DUSE_OPENCL=ON \
            -DCMAKE_BUILD_TYPE=Release
          
          # Compilamos todo el proyecto
          make -j$(nproc)
          
      - name: Find and Prepare Binary
        run: |
          # Buscamos cualquier ejecutable mlc* (como mlc_llm_cli) y lo normalizamos
          find build/ -maxdepth 3 -type f -executable -name "mlc*" -exec cp {} build/mlc_engine \;
          echo "Binario encontrado y preparado."
          ls -lh build/mlc_engine

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: mlc-cli-android-s25
          path: build/mlc_engine
