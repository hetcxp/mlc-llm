- name: Configure and Build
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DUSE_VULKAN=ON \
            -DUSE_OPENCL=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DTVM_FFI_USE_LIBBACKTRACE=OFF \
            -DMLC_LLM_BUILD_EXECUTABLE=ON
          
          # Construimos el chat_cli que es el más robusto para Android
          make mlc_chat_cli -j$(nproc)
          
      - name: Find and Prepare Binary
        run: |
          # Buscamos el binario específico en la carpeta de salida
          cp build/mlc_chat_cli build/mlc_engine
          echo "Ejecutable creado con éxito."

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: mlc-cli-android-s25
          path: |
            build/mlc_engine
            build/*.so
            build/tvm/*.so

**Héctor, hacé este último intento.** Si el `make mlc_chat_cli` llega al final, el ZIP nuevo tendrá un archivo llamado `mlc_engine` que NO termina en `.so`. Ese es el que necesitamos.

