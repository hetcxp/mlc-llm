- name: Configure and Build
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DUSE_VULKAN=ON \
            -DUSE_OPENCL=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DTVM_FFI_USE_LIBBACKTRACE=OFF
          
          # Forzamos la creación del binario de CLI específicamente
          # En la versión 0.2.2 el target suele ser mlc_llm_cli
          make mlc_llm_cli -j$(nproc) || make all -j$(nproc)
          
      - name: Debug - List all files
        run: ls -R build/ # Esto nos dirá en el log dónde quedó el archivo si falla

      - name: Find and Prepare Binary
        run: |
          # Buscamos cualquier cosa que sea un ejecutable y que NO sea una carpeta
          # El S25 necesita el binario puro
          EXECUTABLE=$(find build/ -type f -executable -name "mlc*" | head -n 1)
          if [ -z "$EXECUTABLE" ]; then
            echo "ERROR: No se encontró ningún binario ejecutable."
            exit 1
          fi
          cp "$EXECUTABLE" build/mlc_engine
          echo "Binario encontrado en $EXECUTABLE y copiado a build/mlc_engine"

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: mlc-cli-android-s25
          path: build/mlc_engine
