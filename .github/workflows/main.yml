name: Build MLC-Engine for S25 (v10)
on: [workflow_dispatch]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b 
          add-to-path: true

      - name: Setup Rust for Android
        run: |
          rustup target add aarch64-linux-android

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install cmake
          sudo apt-get update && sudo apt-get install -y build-essential git

      - name: Configure and Build
        run: |
          mkdir build && cd build
          # FLAGS AGRESIVOS: Desactivamos libbacktrace y forzamos la creación del ejecutable
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DUSE_VULKAN=ON \
            -DUSE_OPENCL=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_LIBBACKTRACE=OFF \
            -DTVM_FFI_USE_LIBBACKTRACE=OFF \
            -DTVM_BACKTRACE_ON_SEGFAULT=OFF \
            -DMLC_LLM_BUILD_EXECUTABLE=ON
          
          # Forzamos la compilación del binario CLI específico (el "cuerpo" que nos faltaba)
          make mlc_chat_cli -j$(nproc)
          
      - name: Find and Prepare Binary
        if: always()
        run: |
          # Buscamos el binario generado y lo renombramos para que sea fácil de identificar
          if [ -f "build/mlc_chat_cli" ]; then
            cp build/mlc_chat_cli build/mlc_engine
            echo "¡ÉXITO! Ejecutable encontrado y preparado."
          else
            echo "No se encontró el ejecutable mlc_chat_cli. Listando archivos para debug:"
            find build/ -maxdepth 3 -type f -executable
            exit 1
          fi

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: mlc-cli-android-s25
          path: |
            build/mlc_engine
            build/*.so
            build/tvm/*.so
